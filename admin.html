<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Read It! Учитель</title>
  <meta name="robots" content="noindex">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Учитель">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    body { font-size: 16px; }
    .admin { max-width: 980px; padding-bottom: 48px; }
    .admin .top h1 { font-size: 26px; }
    .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
    .card { background: var(--tile); border: 2px solid var(--line); border-bottom: 5px solid var(--tile-edge); border-radius: var(--r-sheet); padding: 16px; display: grid; gap: 8px; text-align: left; width: 100%; }
    button.card:active { transform: translateY(3px); border-bottom-width: 2px; margin-bottom: 3px; }
    .card h3 { font-size: 20px; }
    .kv { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 15px; color: var(--ink-soft); }
    .kv b { color: var(--ink); }
    .pill { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: 13px; font-weight: 700; border: 2px solid var(--line); }
    .pill.ok { color: var(--leaf); border-color: var(--leaf); background: var(--leaf-soft); }
    .pill.wait { color: #b26a00; border-color: var(--sun); background: var(--sun-soft); }
    .pill.late { color: var(--coral); border-color: var(--coral); background: var(--coral-soft); }
    .pill.idle { color: var(--ink-soft); }
    table { width: 100%; border-collapse: collapse; font-size: 15px; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { font-size: 13px; color: var(--ink-soft); font-weight: 700; }
    .scroll { overflow-x: auto; }
    .acc { display: grid; grid-template-columns: 64px 1fr 56px; gap: 10px; align-items: center; font-size: 15px; }
    .acc .bar { height: 10px; border-radius: 99px; background: var(--mist); overflow: hidden; margin: 0; }
    .acc .bar i { display: block; height: 100%; border-radius: 99px; }
    .acc b { color: var(--coral); font-size: 18px; }
    .two { display: grid; gap: 14px; grid-template-columns: 1fr; }
    @media (min-width: 820px) { .two { grid-template-columns: 1fr 1fr; } }
    .form { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }
    .form .field.wide { grid-column: 1 / -1; }
    .form .field input, .form .field select { font-size: 16px; min-height: 46px; }
    .linkbox { display: flex; gap: 8px; align-items: center; }
    .linkbox input { flex: 1; min-width: 0; font-size: 14px; padding: 10px; border: 2px solid var(--line); border-radius: 12px; background: var(--paper); }
    .linkbox .btn { width: auto; min-height: 44px; font-size: 15px; padding: 8px 14px; }
    .small-btn { width: auto; min-height: 40px; font-size: 15px; padding: 6px 14px; border-bottom-width: 3px; }
    .back { margin-bottom: 8px; }
    .feed-mist { color: var(--ink-soft); font-size: 13px; }
    .demo { background: var(--sun-soft); border: 2px dashed var(--sun); border-radius: 16px; padding: 12px 14px; font-size: 15px; margin-bottom: 14px; }
  </style>
  <script src="config.js"></script>
</head>
<body>
  <main id="root" class="app admin"></main>
  <div class="toast" id="toast" role="status"></div>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
